[package]
name = "herdr-core"
version = "0.1.21"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "herdr-core"
path = "src/main.rs"

[features]
managed = ["dep:sha2"]
# Never distribute this build: path overrides are deliberately test-only.
managed-test = ["managed"]

[[bin]]
name = "nearshell-hc"
path = "src/nearshell_main.rs"
required-features = ["managed"]

[dependencies]
sha2 = { version = "0.10", optional = true }
clap = { version = "4", features = ["derive", "string"] }
ghostty-vt = { path = "../ghostty-vt" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "process", "sync", "time", "macros", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
