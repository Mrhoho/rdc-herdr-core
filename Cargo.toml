[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

# Release builds use LTO and strip symbols.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# A remote install hashes a whole core; unoptimized, a debug-size one takes seconds.
[profile.dev.package.sha2]
opt-level = 3

# On top of clippy's defaults (CI denies warnings).
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
